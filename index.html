            is_featured: false,
            views: 0
          });
        }
      } catch (e) {
        console.error('Sys config save error:', e);
      }
    };

    const getEditorName = (authorStr) => {
      if (!authorStr || authorStr === 'XYZ' || authorStr === 'Pipariya Peoples' || authorStr === 'संपादक' || authorStr === 'पिपरिया पीपुल्स') {
        return 'राजवर्धन बल्दुआ (संपादक)';
      }
      if (authorStr.includes('संपादक') || authorStr.includes('राजवर्धन')) {
        return authorStr;
      }
      return authorStr + ' (संपादक)';
    };

    // --- Blogger Feed Fetcher ---
    const BLOGGER_FEED_URL = 'https://www.pipariyapeoples.com/feeds/posts/default?alt=json&max-results=50';

    const mapBloggerCategory = (terms) => {
      if (!terms || terms.length === 0) return 'पिपरिया';
      const catMap = {
        'pipariya news': 'पिपरिया', 'Pipariya': 'पिपरिया', 'pipariya': 'पिपरिया',
        'Pipariya Politics': 'पिपरिया', 'Pipariya police': 'पिपरिया',
        'Pipariya Tourism': 'पिपरिया', 'pipariya college': 'पिपरिया',
        'Pipariy': 'पिपरिया', 'Pipariya-Sansad': 'पिपरिया',
        'Pipariya MLA': 'पिपरिया', 'Pipariya polytics': 'पिपरिया',
        'mpeb-pipariya': 'पिपरिया', 'pachmari': 'पिपरिया',
        'mp news': 'मध्यप्रदेश', 'madhya pradesh': 'मध्यप्रदेश', 'mp': 'मध्यप्रदेश',
        'MP GOVT': 'मध्यप्रदेश', 'Bhopal': 'मध्यप्रदेश', 'mp news is': 'मध्यप्रदेश',
        'national': 'देश-विदेश', 'international': 'देश-विदेश', 'nat': 'देश-विदेश',
        'News Update': 'देश-विदेश', 'News': 'देश-विदेश',
        'chattisgarh': 'देश-विदेश', 'Chhattisgarh': 'देश-विदेश',
        'Crime news': 'अपराध', 'Crime': 'अपराध', 'Crimes': 'अपराध', 'hatya': 'अपराध',
        'Sports News': 'खेल', 'Sports': 'खेल',
        'business news': 'व्यापार',
        'dharm': 'धर्म', 'culture': 'धर्म', 'rahsifal': 'धर्म',
        'cinema': 'मनोरंजन', 'Movie': 'मनोरंजन', 'cinem': 'मनोरंजन',
        'health': 'स्वास्थ्य', 'Medical': 'स्वास्थ्य', 'Hospital': 'स्वास्थ्य',
        'pipariya-kishan': 'खेती-किसानी', 'pipariya-mandi': 'खेती-किसानी',
        'lifestyle': 'जीवनशैली', 'food': 'जीवनशैली',
        'Tourism': 'पिपरिया', 'Job': 'देश-विदेश',
        'BJP': 'मध्यप्रदेश', 'cm Shivarj Singh': 'मध्यप्रदेश', 'cm Shivarj': 'मध्यप्रदेश',
        'shivraj singh chouhan': 'मध्यप्रदेश',
      };
      for (const t of terms) {
        const term = t.term || t;
        if (catMap[term]) return catMap[term];
      }
      return 'देश-विदेश';
    };

    const extractImageFromContent = (htmlContent) => {
      if (!htmlContent) return null;
      const match = htmlContent.match(/src="(https?:\/\/[^"]+\.(jpg|jpeg|png|gif|webp)[^"]*)"/i);
      return match ? match[1].replace(/\/s\d+\//, '/s800/') : null;
    };

    const stripHtml = (html) => {
      if (!html) return '';
      const doc = new DOMParser().parseFromString(html, 'text/html');
      return doc.body.textContent || '';
    };

    const fetchBloggerNews = () => {
      return new Promise((resolve) => {
        const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
        const callbackName = '_bloggerCb_' + Date.now();
        const timeout = setTimeout(() => {
          delete window[callbackName];
          console.error('Blogger feed timeout');
          resolve([]);
        }, 10000);

        window[callbackName] = (json) => {
          clearTimeout(timeout);
          delete window[callbackName];
          try {
            const entries = json.feed.entry || [];
            const newsItems = entries
              .filter(entry => {
                const pubDate = new Date(entry.published.$t);
                return pubDate >= oneWeekAgo;
              })
              .map((entry, idx) => {
                const thumbnail = entry.media$thumbnail ? entry.media$thumbnail.url.replace(/\/s\d+-c\//, '/s800/') : null;
                const contentImg = extractImageFromContent(entry.content ? entry.content.$t : '');
                const imageUrl = thumbnail || contentImg || 'https://images.unsplash.com/photo-1504711434969-e33886168d6c?q=80&w=800';
                const postUrl = entry.link ? entry.link.find(l => l.rel === 'alternate') : null;
                const bloggerCats = entry.category || [];
                return {
                  id: 'blog_' + (entry.id.$t.split('.post-')[1] || idx),
                  title: (entry.title.$t || '').trim(),
                  category: mapBloggerCategory(bloggerCats),
                  location_tag: '',
                  image_url: imageUrl,
                  content: stripHtml(entry.content ? entry.content.$t : ''),
                  author: (entry.author && entry.author[0] && entry.author[0].name.$t !== 'XYZ' && entry.author[0].name.$t !== 'Pipariya Peoples') ? entry.author[0].name.$t : 'राजवर्धन बल्दुआ (संपादक)',
                  is_featured: idx === 0,
                  views: 0,
                  created_at: entry.published.$t,
                  source_url: postUrl ? postUrl.href : '',
                };
              });
            resolve(newsItems);
          } catch (err) {
            console.error('Blogger parse error:', err);
            resolve([]);
          }
        };

        const script = document.createElement('script');
        script.src = BLOGGER_FEED_URL.replace('alt=json', 'alt=json-in-script') + '&callback=' + callbackName;
        script.onerror = () => {
          clearTimeout(timeout);
          delete window[callbackName];
          resolve([]);
        };
        document.head.appendChild(script);
        script.onload = () => document.head.removeChild(script);
      });
    };

    const CATEGORIES = ['ताज़ा', 'पिपरिया', 'नर्मदापुरम', 'मध्यप्रदेश', 'खेती-किसानी', 'अपराध', 'व्यापार', 'देश-विदेश'];

    // --- Helpers ---
    const getYouTubeEmbedUrl = (url) => {
      if (!url || typeof url !== 'string') return null;
      const trimmed = url.trim();
      if (trimmed.includes('youtube.com/embed/')) {
        return trimmed.includes('?') ? trimmed + '&autoplay=1' : trimmed + '?autoplay=1';
      }
      const regExp = /(?:youtube(?:-nocookie)?\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?|live)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const match = trimmed.match(regExp);
      if (match && match[1]) {
        return 'https://www.youtube.com/embed/' + match[1] + '?autoplay=1&rel=0';
      }
      return null;
    };

    const renderArticleMedia = (article) => {
      if (!article) return null;
      const ytEmbed = getYouTubeEmbedUrl(article.video_link);
      if (ytEmbed) {
        return (
          <iframe 
            id="article-media-iframe"
            src={ytEmbed + '&enablejsapi=1'} 
            className="w-full h-full border-0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowFullScreen
          ></iframe>
        );
      }
      if (article.video_link) {
        return (
          <video 
            id="article-media-video"
            src={article.video_link} 
            controls 
            autoPlay 
            poster={article.image_url} 
            className="w-full h-full object-contain"
          ></video>
        );
      }
      return <img src={article.image_url} alt="" className="w-full h-full object-cover" />;
    };

    // --- Components ---

    function Logo({ variant = 'dark', className = 'h-9 w-auto', onClick }) {
      const srcFile = variant === 'light' ? '/clean_logo.png' : '/clean_logo.png';
      return (

            if (!e.target.src.includes('clean_logo.png')) {
              e.target.src = '/clean_logo.png';
            }
          }}

      );
    }

    function App() {
      const [news, setNews] = useState([]);

      });
      const [pushEnabled, setPushEnabled] = useState(true);

        try {

        } catch(e) {}
        return [
          { id: 'n1', title: '⚡ पिपरिया शहर में बिजली कटौती अलर्ट', body: 'सदर बाज़ार एवं मंगलवारा क्षेत्र में कल सुबह 8 से शाम 6 बजे तक बिजली कटौती रहेगी।', articleId: null, time: '10 मिनट पहले', icon: 'bolt', color: 'orange' },

        ];
      });

        if (!('speechSynthesis' in window)) return null;

        // Strictly prioritize Microsoft Swara Neural Female Voice

        v = voices.find(x => x.name.includes('Kalpana') || (x.name.includes('Microsoft') && x.lang.includes('hi')));

        v = voices.find(x => x.lang.startsWith('hi'));
        return v || null;

          window.speechSynthesis.cancel();
          setIsSpeaking(false);
          showToast('ऑडियो समाचार रोक दिया गया');
          return;
        }

        const cleanTitle = article.title ? article.title.trim() : '';
        const cleanContent = article.content ? article.content.trim() : '';
        const fullText = `${cleanTitle}। ${cleanContent}`.slice(0, 450);

        showToast('🎙️ स्वरा (Swara Neural) हिंदी एंकर तैयार हो रही है...');

        // Primary Engine: Microsoft Swara Neural Voice via FreeTTS API
        try {
          const res = await fetch('https://freetts.org/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: fullText,
              voice: 'hi-IN-SwaraNeural',
              rate: '+0%',
              pitch: '+0Hz'
            })
          });

          if (res.ok) {
            const data = await res.json();
            if (data && data.file_id) {
              const audioUrl = `https://freetts.org/api/audio/${data.file_id}`;
              const audio = new Audio(audioUrl);
              audio.playbackRate = 0.95;

              audio.onplay = () => {
                setIsSpeaking(true);
                showToast('🎙️ स्वरा (Swara Neural) एंकर समाचार पढ़ रही है...');
              };

              audio.onended = () => {
                setIsSpeaking(false);
                window.currentNewsAudio = null;
              };

              audio.onerror = () => {
                window.currentNewsAudio = null;
                fallbackWebSpeechSwara(fullText);
              };

              window.currentNewsAudio = audio;
              await audio.play();
              return;
            }
          }
        } catch (e) {}

        // Fallback: Swara WebSpeech
        fallbackWebSpeechSwara(fullText);
      };

      const fallbackWebSpeechSwara = (textToRead) => {
        if (!('speechSynthesis' in window)) {
          showToast('ऑडियो सपोर्ट उपलब्ध नहीं है', 'error');
          setIsSpeaking(false);
          return;
        }

        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'hi-IN';
        utterance.rate = 0.88;
        utterance.pitch = 1.05;

        const swaraVoice = getSwaraVoice();
        if (swaraVoice) utterance.voice = swaraVoice;

        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);

        window.speechSynthesis.cancel();
        setTimeout(() => {
          window.speechSynthesis.speak(utterance);
          setIsSpeaking(true);
          showToast('🎙️ स्वरा (Swara Neural) एंकर समाचार पढ़ रही है...');
        }, 50);

      const fetchNews = async () => {
        setLoading(true);
        try {

          const [supaResult, bloggerNews] = await Promise.all([
            supabase.from('news').select('*').order('created_at', { ascending: false }).then(r => r).catch(() => ({ data: null, error: true })),
            fetchBloggerNews()
          ]);

          const supaData = (supaResult.data && !supaResult.error) ? supaResult.data : [];
          
          // Separate system config records from actual news articles
          const regularSupaNews = [];
          const sysViewsMap = new Map();

          supaData.forEach(item => {
            if (!item || !item.category) return;
            if (item.category === '_sys_breaking') {
              if (item.content) {
                setBreakingText(item.content);
                try { localStorage.setItem('pipariya_breaking', item.content); } catch(e) {}
              }
            } else if (item.category === '_sys_notif') {
              if (item.content) {
                try {
                  const parsed = JSON.parse(item.content);
                  if (Array.isArray(parsed)) {
                    setNotifications(parsed);
                    localStorage.setItem('pipariya_notifs', JSON.stringify(parsed));
                  }
                } catch(e) {}
              }
            } else if (item.category === '_sys_live') {
              if (item.content) {
                try {
                  const parsed = JSON.parse(item.content);
                  if (parsed && typeof parsed === 'object') {
                    setLiveState(parsed);
                    localStorage.setItem('pipariya_live', JSON.stringify(parsed));
                  }
                } catch(e) {}
              }
            } else if (item.category.startsWith('_sys_view_')) {
              const artId = item.category.replace('_sys_view_', '');
              sysViewsMap.set(artId, Number(item.content) || 0);
            } else {
              regularSupaNews.push(item);
            }
          });

          const map = new Map();
          // Blogger news first - strictly 0 initial views, updated only by genuine app clicks
          bloggerNews.forEach(item => {
            if (item && item.id) {
              const realViews = sysViewsMap.get(item.id) || Number(localStorage.getItem('real_app_views_' + item.id)) || 0;
              item.views = realViews;
              map.set(item.id, item);
            }
          });
          // Supabase/admin news overrides (higher priority)
          regularSupaNews.forEach(item => { if (item && item.id) map.set(item.id, item); });

          const merged = Array.from(map.values()).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          if (merged.length > 0) {
            setNews(merged);
            try { localStorage.setItem('pipariya_news', JSON.stringify(merged)); } catch (e) {}
          } else {
            loadLocalNews();
          }
        } catch (err) {
          loadLocalNews();
        } finally {
          setLoading(false);
        }

            setNews(bloggerNews);
            try { localStorage.setItem('pipariya_news', JSON.stringify(bloggerNews)); } catch (e) {}

        setNews(DEMO_NEWS);

                  icon: 'IMG_5473.PNG'

          }

        try {

        if (diff < 60) return 'अभी';
        if (diff < 3600) return Math.floor(diff / 60) + ' मिनट पहले';
        if (diff < 86400) return Math.floor(diff / 3600) + ' घंटे पहले';
        return Math.floor(diff / 86400) + ' दिन पहले';
      };

        try {

        } catch (e) {}

        if (!isAlreadyViewed) {
          try { sessionStorage.setItem(sessionKey, '1'); } catch (e) {}
          const newViews = (item.views || 0) + 1;
          const updatedItem = { ...item, views: newViews };
          setSelectedArticle(updatedItem);
          setNews(prev => prev.map(n => n.id === item.id ? updatedItem : n));
          
          try { localStorage.setItem('real_app_views_' + item.id, newViews.toString()); } catch(e) {}
          if (item.id && !item.id.toString().startsWith('blog_')) {
            supabase.from('news').update({ views: newViews }).eq('id', item.id).then(() => {}).catch(() => {});
          } else {
            saveSystemConfig('_sys_view_' + item.id, newViews.toString());
          }
        } else {
          setSelectedArticle(item);
        }
      };

      const filteredNews = (news || []).filter(item => {
        if (!item) return false;
        const matchesCategory = activeCategory === 'ताज़ा' || item.category === activeCategory;
        const titleText = (item.title || '').toString().toLowerCase();

        const q = (searchQuery || '').toString().toLowerCase();
        const matchesSearch = !q || titleText.includes(q) || contentText.includes(q);
        return matchesCategory && matchesSearch;
      });

      const featuredNews = filteredNews.find(n => n && n.is_featured) || filteredNews[0];
      const regularNews = filteredNews.filter(n => n !== featuredNews);
      const videoNews = (news || []).filter(n => n && typeof n.video_link === 'string' && n.video_link.trim().length > 0 && (activeCategory === 'ताज़ा' || n.category === activeCategory));

      return (

            {/* Search Dropdown (Aesthetic Shadow & Glassmorphism Animation) */}
            {isSearchOpen && (
              <div className="px-4 pb-3.5 pt-2.5 border-t border-neutral-100/60 bg-white/95 backdrop-blur-xl shadow-md animate-[slideDown_0.25s_cubic-bezier(0.16,1,0.3,1)]">
                <div className="relative">

                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-8 py-2.5 bg-white border border-orange-500/20 rounded-full text-xs font-hindi text-slate-800 outline-none shadow-[0_8px_25px_-4px_rgba(255,109,0,0.16),0_4px_12px_-2px_rgba(0,0,0,0.05)] focus:shadow-[0_12px_30px_-4px_rgba(255,109,0,0.25),0_6px_16px_-2px_rgba(0,0,0,0.08)] focus:border-primary/60 transition-all duration-300"

                  <span className="material-symbols-outlined absolute left-3 top-2.5 text-primary text-base">search</span>

                      <span className="material-symbols-outlined text-base">close</span>

            {/* Breaking News Ticker (पट्टी) */}
            <div className="bg-slate-900 text-white text-xs px-3 py-2 flex items-center gap-2 overflow-hidden border-t border-slate-800 shadow-inner">
              <div className="bg-gradient-to-r from-red-600 to-orange-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-md shrink-0 flex items-center gap-1 shadow-sm">
                <span className="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
                <span>ब्रेकिंग</span>
              </div>
              <div className="overflow-hidden flex-1 relative font-hindi h-5">
                <div className="animate-marquee cursor-pointer text-slate-200 font-medium text-xs">
                  {breakingText ? breakingText : (news.length > 0 ? news.slice(0, 5).map(n => n.title).join('  •  ') : 'पिपरिया पीपुल्स — ताज़ा खबरें जल्द आ रही हैं...')}
                </div>
              </div>

    function AdminDashboard({ news, liveState, setLiveState, breakingText, setBreakingText, notifications, setNotifications, onSave, onDelete, showToast }) {
      const [editingItem, setEditingItem] = useState(null);
      const [isCreating, setIsCreating] = useState(false);
      const [activeAdminSubTab, setActiveAdminSubTab] = useState('news');

      const [liveForm, setLiveForm] = useState({
        title: liveState.title || '',
        location: liveState.location || '',
        streamUrl: liveState.streamUrl || '',
        isLive: !!liveState.isLive
      });

      useEffect(() => {
        setLiveForm({
          title: liveState.title || '',
          location: liveState.location || '',
          streamUrl: liveState.streamUrl || '',
          isLive: !!liveState.isLive
        });
      }, [liveState]);

      const [sendLiveNotif, setSendLiveNotif] = useState(true);
      const [newUpdateText, setNewUpdateText] = useState('');
      const [notifForm, setNotifForm] = useState({ title: '', body: '', articleId: '' });

      const handleSaveLiveSettings = (e) => {
        e.preventDefault();
        const updated = {
          ...liveState,
          ...liveForm
        };
        setLiveState(updated);
        try { localStorage.setItem('pipariya_live', JSON.stringify(updated)); } catch (err) {}
        saveSystemConfig('_sys_live', JSON.stringify(updated));

        if (sendLiveNotif && liveForm.isLive) {
          const liveNotifItem = {
            id: 'notif_live_' + Date.now(),
            title: `🔴 LIVE: ${liveForm.title || 'पिपरिया पीपुल्स सीधा प्रसारण'}`,
            body: `${liveForm.location ? liveForm.location + ' से ' : ''}सीधा प्रसारण चालू है! देखने के लिए यहाँ क्लिक करें ▶`,
            type: 'live',
            articleId: null,
            time: 'अभी',
            icon: 'live_tv',
            color: 'red'
          };

          const updatedNotifs = [liveNotifItem, ...(notifications || [])];
          setNotifications(updatedNotifs);
          try { localStorage.setItem('pipariya_notifs', JSON.stringify(updatedNotifs)); } catch(e) {}
          saveSystemConfig('_sys_notif', JSON.stringify(updatedNotifs));

          if ('Notification' in window) {
            if (Notification.permission === 'granted') {
              new Notification(`🔴 LIVE: ${liveForm.title || 'पिपरिया पीपुल्स'}`, {
                body: `${liveForm.location ? liveForm.location + ' से ' : ''}सीधा प्रसारण चालू है! देखने के लिए क्लिक करें ▶`,
                icon: 'IMG_5473.PNG'
              });
            } else if (Notification.permission !== 'denied') {
              Notification.requestPermission().then(perm => {
                if (perm === 'granted') {
                  new Notification(`🔴 LIVE: ${liveForm.title || 'पिपरिया पीपुल्स'}`, {
                    body: `${liveForm.location ? liveForm.location + ' से ' : ''}सीधा प्रसारण चालू है! देखने के लिए क्लिक करें ▶`,
                    icon: 'IMG_5473.PNG'
                  });
                }
              });
            }
          }
          showToast('✅ लाइव सेव हुआ और सभी यूज़र्स को अलर्ट भेज दिया गया!');
        } else {
          showToast('✅ लाइव सेटिंग्स सहेज दी गईं!');
        }
      };

      const handleAddLiveUpdate = (e) => {
        e.preventDefault();
        if (!newUpdateText.trim()) return;

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const updated = {
          ...liveState,
          updates: [
            { id: Date.now().toString(), time: timeStr, text: newUpdateText.trim() },
            ...(liveState.updates || [])
          ]
        };
        setLiveState(updated);
        try { localStorage.setItem('pipariya_live', JSON.stringify(updated)); } catch(e) {}
        saveSystemConfig('_sys_live', JSON.stringify(updated));
        setNewUpdateText('');
        showToast('लाइव टेक्स्ट अपडेट पोस्ट किया गया!');
      };

      const handleDeleteLiveUpdate = (id) => {
        const updated = {
          ...liveState,
          updates: (liveState.updates || []).filter(u => u.id !== id)
        };
        setLiveState(updated);
        try { localStorage.setItem('pipariya_live', JSON.stringify(updated)); } catch(e) {}
        saveSystemConfig('_sys_live', JSON.stringify(updated));
        showToast('अपडेट हटा दिया गया');
      };

      const handleSendPushAlert = (e) => {
        e.preventDefault();
        if (!notifForm.title.trim()) return;

        const newNotif = {
          id: 'n_' + Date.now(),
          title: notifForm.title.trim(),
          body: notifForm.body.trim(),
          articleId: notifForm.articleId || null,
          time: 'अभी',
          icon: notifForm.articleId ? 'article' : 'bolt',
          color: 'orange'
        };

        const updated = [newNotif, ...(notifications || [])];
        setNotifications(updated);
        try { localStorage.setItem('pipariya_notifs', JSON.stringify(updated)); } catch(e) {}
        saveSystemConfig('_sys_notif', JSON.stringify(updated));

        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(notifForm.title, {
            body: notifForm.body,
            icon: 'IMG_5473.PNG'
          });
        }
        showToast('📢 नया अलर्ट जारी किया गया!');
        setNotifForm({ title: '', body: '', articleId: '' });
      };

      const handleDeleteNotification = (id) => {
        const updated = (notifications || []).filter(n => n.id !== id);
        setNotifications(updated);
        try { localStorage.setItem('pipariya_notifs', JSON.stringify(updated)); } catch(e) {}
        saveSystemConfig('_sys_notif', JSON.stringify(updated));
        showToast('नोटिफिकेशन हटा दिया गया');
      };

      if (isCreating || editingItem) {
        return (
          <NewsForm 
            newsItem={editingItem || { title: '', category: 'पिपरिया', location_tag: 'पिपरिया', image_url: '', video_link: '', content: '', author: 'राजवर्धन बल्दुआ (संपादक)', is_featured: false }} 
            onSave={(data) => {
              onSave(data);
              setIsCreating(false);
              setEditingItem(null);
            }} 
            onCancel={() => {
              setIsCreating(false);
              setEditingItem(null);
            }} 
          />
        );
      }

      const totalViews = (news || []).reduce((sum, item) => sum + (Number(item && item.views) || 0), 0);
      const videoNewsCount = (news || []).filter(n => n && typeof n.video_link === 'string' && n.video_link.trim().length > 0).length;
      const topArticle = (news || []).length > 0 ? [...news].sort((a, b) => (Number(b && b.views) || 0) - (Number(a && a.views) || 0))[0] : null;

      return (
        <div className="p-4 space-y-4">
          {/* Quick Analytics Summary */}
          <div className="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-950 p-4 rounded-2xl text-white shadow-md space-y-3">
            <div className="flex justify-between items-center pb-2 border-b border-slate-700/60">
              <div className="flex items-center gap-1.5 font-bold text-xs font-hindi">
                <span className="material-symbols-outlined text-base text-primary">analytics</span>
                <span>एनालिटिक्स व व्यूज़ समरी (Analytics)</span>
              </div>
              <span className="text-[10px] bg-primary/20 text-primary-100 font-extrabold px-2 py-0.5 rounded-full">LIVE DATA</span>
            </div>

            <div className="grid grid-cols-3 gap-2 text-center">
              <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/50">
                <span className="text-[10px] text-slate-400 font-medium block">कुल व्यूज़</span>
                <span className="text-base font-extrabold text-amber-400 mt-0.5 block">{totalViews.toLocaleString()}</span>
              </div>
              <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/50">
                <span className="text-[10px] text-slate-400 font-medium block">कुल खबरें</span>
                <span className="text-base font-extrabold text-blue-400 mt-0.5 block">{news.length}</span>
              </div>
              <div className="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/50">
                <span className="text-[10px] text-slate-400 font-medium block">वीडियो रिपोर्ट</span>
                <span className="text-base font-extrabold text-purple-400 mt-0.5 block">{videoNewsCount}</span>
              </div>
            </div>

    // News Form Component for Admin
    function NewsForm({ newsItem, onSave, onCancel }) {
      const [formData, setFormData] = useState(newsItem);
      const [newsType, setNewsType] = useState(newsItem.video_link ? 'video' : 'normal');
      const [fetchingYt, setFetchingYt] = useState(false);

      const handleChange = (e) => {
        const value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
        setFormData({ ...formData, [e.target.name]: value });
      };

      const handleYouTubeAutoFetch = async (urlToFetch) => {
        const url = urlToFetch || formData.video_link;
        if (!url) return;

        setFetchingYt(true);

        const regExp = new RegExp('(?:youtube(?:-nocookie)?\\.com\\/(?:[^\\/\\n\\s]+\\//\\S+\\//|(?:v|e(?:mbed)?)\\//|\\S*?[?&]v=)|youtu\\.be\\/)([a-zA-Z0-9_-]{11})');
        const match = url.match(regExp);
        const videoId = (match && match[1]) ? match[1] : null;

        if (videoId) {
          const hqThumb = 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg';
          const embedUrl = 'https://www.youtube.com/embed/' + videoId;

          try {
            const res = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(url));
            const data = await res.json();
            
            setFormData(prev => ({
              ...prev,
              title: data.title || prev.title,
              author: data.author_name || prev.author || 'पिपरिया पीपुल्स टीम',
              content: prev.content || ((data.title || '') + ' - देखिए पिपरिया पीपुल्स की विशेष वीडियो रिपोर्ट।'),
              image_url: hqThumb || data.thumbnail_url || prev.image_url,
              video_link: embedUrl
            }));
          } catch (err) {
            setFormData(prev => ({
              ...prev,
              image_url: prev.image_url || hqThumb,
              video_link: embedUrl
            }));
          }
        }
        setFetchingYt(false);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ ...formData, views: formData.views || 0 });
      };

      return (
        <form onSubmit={handleSubmit} className="p-4 bg-surface min-h-screen space-y-4 pb-20">
          <div className="flex justify-between items-center mb-2 pb-2 border-b border-neutral-100">
            <h3 className="font-bold text-lg text-slate-800">{formData.id ? 'संपादित करें' : 'नई खबर / वीडियो बनाएं'}</h3>
            <button type="button" onClick={onCancel} className="text-neutral-500 text-sm font-medium hover:text-slate-800">रद्द करें</button>
          </div>

          {/* News Type Selector */}
          <div className="bg-slate-100 p-1 rounded-xl flex gap-1 border border-neutral-200">
            <button
              type="button"
              onClick={() => setNewsType('normal')}
              className={'flex-1 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition-all ' + (
                newsType === 'normal' ? 'bg-white text-slate-800 shadow-sm' : 'text-neutral-500 hover:text-slate-800'
              )}
            >
              <span className="material-symbols-outlined text-base">article</span>
              <span>सामान्य समाचार</span>
            </button>
            <button
              type="button"
              onClick={() => setNewsType('video')}
              className={'flex-1 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition-all ' + (
                newsType === 'video' ? 'bg-purple-600 text-white shadow-sm' : 'text-neutral-500 hover:text-slate-800'
              )}
            >
              <span className="material-symbols-outlined text-base">videocam</span>
              <span>🎬 वीडियो समाचार</span>
            </button>
          </div>

          {/* YouTube Auto-Fetch Section (Shows when Video News is active) */}
          {newsType === 'video' && (
            <div className="bg-purple-50 p-3.5 rounded-xl border border-purple-200 space-y-3">
              <div className="flex items-center justify-between">
                <label className="block text-xs font-bold text-purple-900 flex items-center gap-1">
                  <span className="material-symbols-outlined text-base text-purple-700">smart_display</span>
                  YouTube या MP4 वीडियो लिंक
                </label>
                <span className="text-[10px] bg-purple-200 text-purple-800 px-2 py-0.5 rounded-full font-bold">वीडियो मोड</span>
              </div>

              <div className="flex gap-2">
                <input 
                  type="text" 
                  name="video_link" 
                  value={formData.video_link || ''} 
                  onChange={(e) => {
                    handleChange(e);
                    if (e.target.value.includes('youtube.com') || e.target.value.includes('youtu.be')) {
                      handleYouTubeAutoFetch(e.target.value);
                    }
                  }} 
                  className="w-full border border-purple-300 rounded-lg p-2 text-sm outline-none focus:border-purple-600 bg-white" 
                  placeholder="YouTube URL पेस्ट करें (उदा: https://youtu.be/...)" 
                />
                <button
                  type="button"
                  onClick={() => handleYouTubeAutoFetch()}
                  disabled={fetchingYt}
                  className="bg-purple-700 text-white text-xs font-bold px-3 py-2 rounded-lg shadow-sm hover:bg-purple-800 shrink-0 flex items-center gap-1 disabled:opacity-50"
                  title="YouTube से शीर्षक, फ़ोटो व विवरण ऑटो-भरें"
                >
                  <span className="material-symbols-outlined text-base">auto_awesome</span>
                  <span>{fetchingYt ? 'फ़ेच हो रहा...' : 'ऑटो-भरें'}</span>
                </button>
              </div>

              <div className="flex items-center justify-between gap-3 pt-1">
                <label className="flex items-center gap-1.5 bg-white text-purple-800 hover:bg-purple-100 text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer shadow-sm border border-purple-200 shrink-0">
                  <span className="material-symbols-outlined text-base text-purple-600">video_file</span>
                  <span>फ़ोन से वीडियो चुनें</span>
                  <input 
                    type="file" 
                    accept="video/*" 
                    className="hidden" 
                    onChange={(e) => {
                      const file = e.target.files[0];
                      if (file) {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                          setFormData({ ...formData, video_link: reader.result });
                        };
                        reader.readAsDataURL(file);
                      }
                    }} 
                  />
                </label>

                <div className="flex items-center gap-1">
                  <span className="text-[11px] text-purple-800 font-medium">अवधि:</span>
                  <input 
                    type="text" 
                    name="duration" 
                    value={formData.duration || ''} 
                    onChange={handleChange} 
                    className="w-20 border border-purple-300 rounded-lg p-1 text-xs outline-none bg-white text-center font-bold" 
                    placeholder="02:45" 
                  />
                </div>
              </div>
            </div>
          )}

          <div>
            <label className="block text-xs font-bold text-neutral-700 mb-1">समाचार शीर्षक (News Title)</label>
            <textarea name="title" value={formData.title} onChange={handleChange} required className="w-full border border-neutral-300 rounded-lg p-2 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none" rows="2" placeholder="यहाँ समाचार का मुख्य शीर्षक लिखें..."></textarea>
          </div>

          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="block text-xs font-bold text-neutral-700 mb-1">श्रेणी (Category)</label>
              <select name="category" value={formData.category} onChange={handleChange} className="w-full border border-neutral-300 rounded-lg p-2 text-sm outline-none focus:border-primary">
                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-bold text-neutral-700 mb-1">स्थान (Location)</label>
              <input type="text" name="location_tag" value={formData.location_tag} onChange={handleChange} className="w-full border border-neutral-300 rounded-lg p-2 text-sm outline-none focus:border-primary" placeholder="उदा: पिपरिया" />
            </div>
          </div>

          {/* Image Section */}
          <div>
            <label className="block text-xs font-bold text-neutral-700 mb-1">तस्वीर (Attach Photo / Image URL)</label>
            
            <div className="flex items-center gap-2 mb-2">
              <label className="flex items-center gap-1.5 bg-primary/10 text-primary hover:bg-primary/20 text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer transition-colors border border-primary/20">
                <span className="material-symbols-outlined text-base">upload_file</span>
                <span>गैलरी से फ़ोटो चुनें</span>
                <input 
                  type="file" 
                  accept="image/*" 
                  className="hidden" 
                  onChange={(e) => {
                    const file = e.target.files[0];
                    if (file) {
                      const reader = new FileReader();
                      reader.onloadend = () => {
                        setFormData({ ...formData, image_url: reader.result });
                      };
                      reader.readAsDataURL(file);
                    }
                  }} 
                />
              </label>
              <span className="text-xs text-neutral-400 font-medium">या फ़ोटो लिंक:</span>
            </div>

            <input 
              type="text" 
              name="image_url" 
              value={formData.image_url} 
              onChange={handleChange} 
              required 
              className="w-full border border-neutral-300 rounded-lg p-2 text-sm outline-none focus:border-primary focus:ring-1 focus:ring-primary" 
              placeholder="https://... या ऊपर बटन से फ़ाइल चुनें" 
            />

            {formData.image_url && (
              <div className="mt-3 relative inline-block">
                <img src={formData.image_url} className="h-28 w-auto rounded-lg object-cover border border-neutral-200 shadow-sm" alt="Preview"/>
                <button 
                  type="button" 
                  onClick={() => setFormData({ ...formData, image_url: '' })} 
                  className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md hover:bg-red-600 transition-colors"
                  title="हटाएं"
                >
                  <span className="material-symbols-outlined text-xs leading-none">close</span>
                </button>
              </div>
            )}
          </div>

          <div>
            <label className="block text-xs font-bold text-neutral-700 mb-1">खबर का विवरण (Content)</label>
            <textarea name="content" value={formData.content} onChange={handleChange} required className="w-full border border-neutral-300 rounded-lg p-2 text-sm outline-none focus:border-primary focus:ring-1 focus:ring-primary h-36" placeholder="समाचार का पूरा विवरण लिखें..."></textarea>
          </div>

          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="block text-xs font-bold text-neutral-700 mb-1">रिपोर्टर (Author)</label>
              <input type="text" name="author" value={formData.author} onChange={handleChange} required className="w-full border border-neutral-300 rounded-lg p-2 text-sm outline-none focus:border-primary" placeholder="संवाददाता का नाम" />
            </div>
            <div className="flex items-center gap-2 pt-6">
              <input type="checkbox" name="is_featured" checked={formData.is_featured} onChange={handleChange} id="featured" className="w-4 h-4 text-primary rounded focus:ring-primary" />
              <label htmlFor="featured" className="text-xs font-bold text-slate-800">मुख्य खबर बनाएं?</label>
            </div>
          </div>

          <button type="submit" className="w-full bg-primary text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition-transform hover:bg-primary-600">
            सेव करें एवं प्रकाशित करें
          </button>
        </form>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <style>
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</body>
</html>
